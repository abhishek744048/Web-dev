<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image,table and list</title>
</head>
<body>
    <img height="250" src="image.png" alt="batman image">
    <table>
        <caption>My detail</caption>
        <br>
        <thead>header</thead>
        <tbody>
        <tr>
           <th colspan="2">Name</th>
           <th rowspan="3">age</th>
        </tr>
        <tfoot>
        <tr>
            <td colspan="2">Abhishek</td>
            <td rowspan="3">20</td>
        </tr>
        </tbody>
        </tfoot>
    </table>


    <ul type="square">
        <li>Forza horizon</li>
        <li>Residant evil</li>
        <li>Tomb rider</li>
    </ul>

    <ol type="I">
        <li>Forza horizon</li>
        <li>Residant evil</li>
        <li>Tomb rider</li>
    </ol>
</body>
</html>
