<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms uses</title>
</head>

<body>
    <h1>This is my lesson on forms and labels</h1>
    <form action="post">
        <label for="username">Enter the username</label>
        <input type="text" name="Abhishek" placeholder="Enter your username" id="username">
    </form>

    <form action="post">
        <label for="Female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="Male">Male</label>
        <input type="radio" id="Male" name="gender" value="male">
    </form>

    <form action="post">
        <input type="checkbox" name="follow" id="follow">
        <label for="follow">Follow</label>
    </form>

    <form action="post">
        <label for="comment">Enter your comment</label>
        <br>
        <textarea id="comment" name="comment" rows="10" cols="30"></textarea>
        
    </form>

    <select name="Avengers">
        <option value="Iron man">Iron man</option>
        <option value="Iron man">Captain america</option>
        <option value="Iron man">Hulk</option>
    </select>
</body>

</html>
